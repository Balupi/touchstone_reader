    <style>
        /* Custom chevron replacing the plain browser disclosure marker, so
           each collapsible chart section reads clearly as expand/collapse. */
        .chart-section>summary {
            list-style: none;
        }

        .chart-section>summary::-webkit-details-marker {
            display: none;
        }

        .chart-section>summary::before {
            content: "▶";
            display: inline-block;
            width: 1em;
            font-size: 0.8em;
            transition: transform 0.15s ease;
        }

        .chart-section[open]>summary::before {
            transform: rotate(90deg);
        }

        /* Highlighted while a drag is over the drop zone. */
        #drop-zone.is-dragover {
            border-color: #485fc7 !important;
            background-color: rgba(72, 95, 199, 0.08);
        }
    </style>
